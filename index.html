<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AR 名刺</title>
<style>
  :root { --accent:#3f7dfb; --accent2:#00d4b8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#0b0e14; color:#fff;
              font-family:"Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif; }
  #ar-container { position:fixed; inset:0; }
  #ar-container canvas, #ar-container video { width:100% !important; height:100% !important; object-fit:cover; }

  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; text-align:center; padding:28px; gap:18px; z-index:10; }

  /* --- スタート画面 --- */
  #start { background:radial-gradient(120% 100% at 50% 0%, #1b2440 0%, #0b0e14 70%); }
  #start h1 { font-size:22px; margin:0; letter-spacing:.04em; }
  #start p  { font-size:14px; line-height:1.8; opacity:.75; margin:0; max-width:340px; }
  .btn { appearance:none; border:0; border-radius:999px; padding:15px 40px; font-size:16px;
         font-weight:700; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2));
         box-shadow:0 8px 30px rgba(63,125,251,.4); cursor:pointer; }
  .btn:active { transform:scale(.97); }

  /* --- スキャン中ガイド --- */
  #scan { pointer-events:none; opacity:0; transition:opacity .3s; z-index:5; }
  #scan.show { opacity:1; }
  .reticle { width:min(72vw,300px); aspect-ratio:91/55; border-radius:10px; position:relative; }
  .reticle i { position:absolute; width:26px; height:26px; border:3px solid rgba(255,255,255,.9); }
  .reticle i:nth-child(1){ top:0; left:0;  border-right:0; border-bottom:0; border-radius:10px 0 0 0; }
  .reticle i:nth-child(2){ top:0; right:0; border-left:0;  border-bottom:0; border-radius:0 10px 0 0; }
  .reticle i:nth-child(3){ bottom:0;left:0; border-right:0; border-top:0;   border-radius:0 0 0 10px; }
  .reticle i:nth-child(4){ bottom:0;right:0;border-left:0;  border-top:0;   border-radius:0 0 10px 0; }
  #scan .hint { margin-top:20px; font-size:14px; background:rgba(0,0,0,.5);
                padding:9px 18px; border-radius:999px; backdrop-filter:blur(8px); }

  /* --- 認識時に出る回路名 --- */
  #chip { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; z-index:8;
          transform:translate(-50%,-160%); transition:transform .4s cubic-bezier(.2,.9,.25,1);
          background:rgba(20,26,40,.72); border:1px solid rgba(255,255,255,.18);
          backdrop-filter:blur(14px); border-radius:14px; padding:9px 18px; text-align:center;
          width:max-content; max-width:96vw; }
  #chip.show { transform:translate(-50%,0); }
  #chip b { font-size:14px; font-weight:700; letter-spacing:.02em;
            white-space:nowrap; }                      /* 回路名は折り返さない */
  #chip span { display:block; margin-top:3px; font-size:11.5px; opacity:.7;
               font-family:ui-monospace,"SF Mono",Menlo,monospace; }

  /* --- 認識時に出るリンク --- */
  #info { position:fixed; left:0; right:0; bottom:0; z-index:8;
          padding:20px 20px calc(20px + env(safe-area-inset-bottom));
          display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
          transform:translateY(130%); transition:transform .45s cubic-bezier(.2,.9,.25,1); }
  #info.show { transform:translateY(0); }
  #info a, #info button { text-decoration:none; color:#fff; font-size:14px; font-weight:600;
            font-family:inherit; padding:13px 22px; border-radius:999px; cursor:pointer;
            background:rgba(20,26,40,.72); border:1px solid rgba(255,255,255,.18);
            backdrop-filter:blur(14px); }

  #err { display:none; z-index:20; background:#0b0e14; }
  #err p { font-size:14px; line-height:1.9; opacity:.85; max-width:340px; white-space:pre-line; }
  .hidden { display:none !important; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>

<div id="ar-container"></div>

<div class="overlay" id="scan">
  <div class="reticle"><i></i><i></i><i></i><i></i></div>
  <div class="hint">名刺にカメラを向けてください</div>
</div>

<div id="chip"><b id="chip-name"></b><span id="chip-detail"></span></div>

<div id="info">
  <a id="link-web"  href="#" target="_blank" rel="noopener">Webサイト</a>
  <a id="link-mail" href="#">メール</a>
  <button id="btn-shuffle" type="button">別の回路</button>
</div>

<div class="overlay" id="start">
  <p>カメラを使用許可して、名刺をうつすと 3D オブジェクトが浮かび上がります。</p>
  <button class="btn" id="btn-start">AR を開始</button>
</div>

<div class="overlay" id="err">
  <h1 style="font-size:18px;margin:0">カメラを起動できませんでした</h1>
  <p id="err-msg"></p>
  <button class="btn" onclick="location.reload()">再読み込み</button>
</div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

/* =======================================================================
   設定 — ここだけ書き換えれば OK
   ======================================================================= */
const CONFIG = {
  targetSrc : './assets/targets.mind',  // マーカー画像から作った .mind
  cardAspect: 55 / 91,                  // マーカー画像の 高さ÷幅
  name      : 'Atushi Inagaki',
  title     : '弓削商船高等専門学校',
  website   : 'https://d-o-b.sakura.ne.jp/inaCore/html/TeachingMaterials/',
  email     : 'inaphy.ai@gmail.com',
  color1    : 0x3f7dfb,
  color2    : 0x00d4b8,
};

// 3DCircuit の回路を名刺の上に出す設定
const CIRCUIT = {
  enabled  : true,
  dir      : './circuit/presets/',  // 回路JSONの置き場所（index.json でファイルを列挙）
  fill     : 0.80,     // マーカーの横幅に対する回路の幅（0〜1）
  maxHeight: 0.32,     // 電位の立体の高さ（マーカー幅を1としたときの値）
                       // 回路ごとに電圧が違うので、高さはこの値に自動で合わせます
  lift     : 0.015,    // 名刺表面からの浮き
  timeScale: 0.35,     // シミュレーションの速さ（1.0が実時間）
  simHz    : 20,       // 立体の再計算頻度[Hz]。下げると軽くなる
  substeps : 4,        // 1回の再計算あたりの積分刻み数（過渡現象・振動の精度）
  scanSec  : 4,        // 起動時に電位の振れ幅を調べる秒数（高さの自動調整用）
  showParticles: false,// 電荷アニメーション。挙動が怪しいので既定はオフ
  electron : false,    // true にすると電子（負電荷）の向きで流れる
};
/* ======================================================================= */

document.getElementById('link-web').href  = CONFIG.website;
document.getElementById('link-mail').href = 'mailto:' + CONFIG.email;

const $start = document.getElementById('start');
const $scan  = document.getElementById('scan');
const $info  = document.getElementById('info');
const $chip  = document.getElementById('chip');
const $err   = document.getElementById('err');

document.getElementById('btn-start').addEventListener('click', boot, { once:true });

async function boot() {
  $start.classList.add('hidden');
  try {
    await run();
  } catch (e) {
    console.error(e);
    $scan.classList.remove('show');
    $err.style.display = 'flex';
    document.getElementById('err-msg').textContent =
      (e && e.message ? e.message : String(e)) +
      '\n\nHTTPS で開いているか、カメラを他のアプリが使っていないかご確認ください。';
  }
}

/* ---------- 外部スクリプトを順番に読む ---------- */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('読み込み失敗: ' + src));
    document.head.appendChild(s);
  });
}

/* classic script の class / const は window に載らないので橋渡しする */
function exposeGlobals() {
  const s = document.createElement('script');
  s.textContent = `
    window.Simulator = Simulator;
    window.Simulator3D = Simulator3D;
  `;
  document.head.appendChild(s);
}

/* ---------- 3DCircuit 一式を読み込む ---------- */
async function loadCircuitEngine() {
  // simulator.js は math.js（行列演算）に依存
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js');

  // 原本スクリプトが参照するグローバルを用意してから読む
  window.THREE = THREE;               // three 0.160 を THREE として見せる
  window.showIllustrations = false;   // 図記号モード（main.js のフラグ）
  window.isElectronMode = CIRCUIT.electron;

  await loadScript('./circuit/simulator.js');
  await loadScript('./circuit/simulator3d.js');
  await loadScript('./circuit/netlist.js');
  await loadScript('./circuit/particles.js');
  await loadScript('./circuit/circuits.js');
  exposeGlobals();

  if (!window.Simulator3D) throw new Error('Simulator3D を読み込めませんでした');
}

async function run() {
  const mindarThree = new MindARThree({
    container: document.querySelector('#ar-container'),
    imageTargetSrc: CONFIG.targetSrc,
    uiLoading: 'no', uiScanning: 'no', uiError: 'no',
    filterMinCF: 0.0001,   // 追従のなめらかさ（小さいほど滑らか・遅延増）
    filterBeta: 0.001,
  });

  const { renderer, scene, camera } = mindarThree;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const anchor = mindarThree.addAnchor(0);
  const group  = new THREE.Group();
  anchor.group.add(group);

  /* ---------- ライティング ---------- */
  scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.6));
  const key = new THREE.DirectionalLight(0xffffff, 2.0);
  key.position.set(1, 1.5, 2);
  scene.add(key);
  const rim = new THREE.DirectionalLight(CONFIG.color2, 1.1);
  rim.position.set(-1.5, -1, 1);
  scene.add(rim);

  /* ---------- 名刺面に重なる発光フレーム ---------- */
  const frameMat = new THREE.MeshBasicMaterial({
    color: CONFIG.color1, transparent:true, opacity:0.14,
    side: THREE.DoubleSide, depthWrite:false,
  });
  const frame = new THREE.Mesh(new THREE.PlaneGeometry(1.0, CONFIG.cardAspect), frameMat);
  frame.position.z = 0.002;
  group.add(frame);

  /* ---------- 名前ラベル ---------- */
  const label = makeLabel(CONFIG.name, CONFIG.title);
  label.position.set(0, -(CONFIG.cardAspect / 2) - 0.10, 0.05);
  group.add(label);

  /* ---------- 中身（回路 or フォールバック） ---------- */
  const holder = new THREE.Group();
  group.add(holder);

  let circuit = null;
  if (CIRCUIT.enabled) {
    try {
      await loadCircuitEngine();
      circuit = await setupCircuit(holder);
    } catch (e) {
      console.warn('回路エンジンを読み込めませんでした。標準の3Dに切り替えます。', e);
      circuit = null;
    }
  }
  const fallback = circuit ? null : makeFallbackObject(holder);

  /* ---------- 認識イベント ---------- */
  let visible = false;
  anchor.onTargetFound = () => {
    visible = true;
    $scan.classList.remove('show');
    $info.classList.add('show');
    if (circuit) $chip.classList.add('show');
  };
  anchor.onTargetLost = () => {
    visible = false;
    $scan.classList.add('show');
    $info.classList.remove('show');
    $chip.classList.remove('show');
  };

  const $shuffle = document.getElementById('btn-shuffle');
  $shuffle.addEventListener('click', async () => {
    if (!circuit) return;
    $shuffle.disabled = true;
    try { await circuit.shuffle(); } catch (e) { console.error(e); }
    $shuffle.disabled = false;
  });
  if (!circuit) document.getElementById('btn-shuffle').style.display = 'none';

  await mindarThree.start();
  $scan.classList.add('show');

  /* ---------- 描画ループ ---------- */
  const clock = new THREE.Clock();
  let appear = 0;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t  = clock.getElapsedTime();

    appear += ((visible ? 1 : 0) - appear) * Math.min(1, dt * 6);
    frameMat.opacity = 0.14 * appear;
    label.scale.setScalar(0.001 + appear);
    holder.visible = appear > 0.01;

    if (circuit) {
      circuit.step(dt, appear);
    } else if (fallback) {
      fallback.step(dt, t, appear);
    }

    renderer.render(scene, camera);
  });
}

/* =======================================================================
   3DCircuit の回路をマーカー上に組み立てる
   ======================================================================= */
async function setupCircuit(parent) {
  const { Simulator, Simulator3D } = window;

  /* Simulator3D は本来「自前のcanvasに描く」クラスなので、
     レンダラー・カメラ・OrbitControls を作る init() だけ差し替えて、
     生成した立体を MindAR のアンカーに載せる。 */
  class ARCircuit3D extends Simulator3D {
    constructor() { super(null); }

    init() {
      if (this.scene) return;
      this.scene = new THREE.Group();          // Scene の代わりに Group を使う

      this.gridLines = new THREE.Group();
      this.gridLines.visible = false;          // ARでは方眼は出さない
      this.scene.add(this.gridLines);

      const geo = new THREE.SphereGeometry(4, 8, 8);
      this.particleMesh = new THREE.InstancedMesh(
        geo, new THREE.MeshBasicMaterial({ color: 0xff1493 }), 2000);
      this.particleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      this.negParticleMesh = new THREE.InstancedMesh(
        geo, new THREE.MeshBasicMaterial({ color: 0x5c5cff }), 2000);
      this.negParticleMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

      // 電荷を出さない設定のときはシーンに入れない
      // （入れたまま更新しないと、原点に球が2000個たまって見えてしまう）
      if (CIRCUIT.showParticles) {
        this.scene.add(this.particleMesh);
        this.scene.add(this.negParticleMesh);
      }

      this.controls = { target: { set() {} } };  // build() が触るだけのダミー
      this.isActive = true;
    }

    animate() {}            // 独自の描画ループは回さない（MindAR側で描く）
    onWindowResize() {}
    show() { this.isActive = true; if (!this.scene) this.init(); }

    // Canvas テクスチャに色空間を指定（指定しないと色が白っぽくなる）
    getComponentTexture(comp, hl = false) {
      const tex = super.getComponentTexture(comp, hl);
      if (tex && tex.colorSpace !== THREE.SRGBColorSpace) {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
      }
      return tex;
    }
  }

  const sim3d = new ARCircuit3D();
  sim3d.show();

  const fitter = new THREE.Group();   // 縮尺と中心合わせ担当
  fitter.add(sim3d.scene);
  parent.add(fitter);

  const simInterval = 1 / CIRCUIT.simHz;
  const stepDt = simInterval * CIRCUIT.timeScale / CIRCUIT.substeps;  // 実際の積分刻み

  const fileList = await window.loadPresetIndex(CIRCUIT.dir);
  console.log('回路プリセット:', fileList.length + '件', fileList);

  const sim = new Simulator();
  let components = [], results = null, netlist = null;
  let groundOffset = 0, baseScale = 1, lastFile = null;

  /* --- 起動時に電位の振れ幅を先に調べる ---
     直流・交流・過渡現象で電圧の桁が全く違うので、
     この結果に合わせて Z_SCALE（高さ）と接地基準を自動で決めます。 */
  function scanVoltageRange(nl) {
    const scan = new Simulator();
    let lo = Infinity, hi = -Infinity;
    const note = v => { if (Number.isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; } };

    // 電池の上に描かれる「山」の頂点は（−端子の電位＋起電力）＝＋端子の電位なので、
    // ノードの電位だけ見ておけば立体の高さは足りる。
    const consume = res => {
      if (!res || !res.success) return;
      for (const k in res.voltages) note(res.voltages[k]);
    };

    consume(scan.solve(nl, 1e-6));
    const steps = Math.ceil(CIRCUIT.scanSec / stepDt);
    for (let i = 0; i < steps; i++) consume(scan.solve(nl, stepDt));

    if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi - lo < 1e-6) return { lo: 0, span: 1 };
    return { lo, span: hi - lo };
  }

  async function load() {
    const fileName = window.pickPresetName(fileList, lastFile);
    lastFile = fileName;

    const preset = await window.loadPresetFile(fileName, CIRCUIT.dir);
    components = preset.components;
    netlist = window.buildNetlist(components);

    /* --- 縮尺 ---
       素子の頂点は (comp.x - cx) * GRID_SCALE に置かれる。
       セルの「範囲」の中心は cx より半セル右／半セル上にずれるので、その分を戻す。 */
    const xs = components.map(c => c.x);
    const cellsX = Math.max(...xs) - Math.min(...xs) + 1;
    const unit = sim3d.GRID_SCALE;
    baseScale = CIRCUIT.fill / (cellsX * unit);
    fitter.scale.setScalar(baseScale);
    fitter.position.set(0, 0, CIRCUIT.lift);
    sim3d.scene.position.set(-unit / 2, unit / 2, 0);

    /* --- 高さの自動調整 --- */
    const range = scanVoltageRange(netlist);
    groundOffset = range.lo;
    sim3d.Z_SCALE = (CIRCUIT.maxHeight / baseScale) / range.span;

    /* --- 初期状態を組み立てる --- */
    sim.reset();
    const res = sim.solve(netlist, 1e-6);
    if (!res.success) throw new Error(fileName + ': ' + res.message);
    results = window.applyGroundOffset(res, groundOffset);

    sim3d.build(components);
    sim3d.update(components, results);

    /* --- 表示ラベル --- */
    const unitOf = { battery:'V', ac_source:'V', resistor:'Ω', bulb:'Ω',
                     capacitor:'µF', inductor:'mH' };
    const parts = components
      .filter(c => unitOf[c.type])
      .map(c => `${(+c.value)}${unitOf[c.type]}` +
                (c.type === 'ac_source' && c.freq ? ` ${c.freq}Hz` : ''));
    document.getElementById('chip-name').textContent = preset.title;
    document.getElementById('chip-detail').textContent = parts.join('  ·  ');
    console.log(`「${preset.title}」電位幅 ${range.span.toFixed(2)}V → Z_SCALE ${sim3d.Z_SCALE.toFixed(1)}`);
  }

  await load();

  let wallAcc = 0;   // 実時間の積み上げ

  return {
    shuffle: load,
    step(dt, appear) {
      fitter.scale.setScalar(baseScale * (0.001 + appear));   // 出現アニメーション

      // 実時間で 1/simHz 秒たつごとに、シミュレーション時間を
      // (1/simHz × timeScale) 秒ぶんだけ substeps 回に分けて進める
      wallAcc += dt;
      if (wallAcc < simInterval) return;
      wallAcc = 0;

      // 積分は細かく、立体の作り直しは1回だけ（作り直しが一番重いため）
      let res = null;
      for (let i = 0; i < CIRCUIT.substeps; i++) res = sim.solve(netlist, stepDt);
      if (!res || !res.success) return;

      results = window.applyGroundOffset(res, groundOffset);
      sim3d.update(components, results);

      if (CIRCUIT.showParticles) {
        const sdt = stepDt * CIRCUIT.substeps;
        window.advanceParticleProgress(components, results, sdt, CIRCUIT.electron);
        sim3d.updateParticles(components, results);
      }
    },
  };
}

/* =======================================================================
   回路エンジンが読めなかったときの予備の3D
   ======================================================================= */
function makeFallbackObject(parent) {
  const core = new THREE.Group();
  core.position.set(0, 0, 0.26);
  parent.add(core);

  const solid = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.16, 0),
    new THREE.MeshStandardMaterial({ color: CONFIG.color1, metalness:0.55, roughness:0.22, flatShading:true })
  );
  core.add(solid);

  const wire = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(0.225, 1)),
    new THREE.LineBasicMaterial({ color: CONFIG.color2, transparent:true, opacity:0.75 })
  );
  core.add(wire);

  return {
    step(dt, t, appear) {
      core.scale.setScalar(0.001 + appear);
      solid.rotation.y += dt * 0.80;
      solid.rotation.x += dt * 0.32;
      wire.rotation.y  -= dt * 0.35;
      core.position.z   = 0.26 + Math.sin(t * 1.5) * 0.022;
    },
  };
}

/* 文字テクスチャの板を作る */
function makeLabel(name, title) {
  const W = 1024, H = 256;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');

  const grad = g.createLinearGradient(0, 0, W, 0);
  grad.addColorStop(0,   'rgba(12,16,28,0)');
  grad.addColorStop(0.5, 'rgba(12,16,28,0.82)');
  grad.addColorStop(1,   'rgba(12,16,28,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);

  g.textAlign = 'center';
  g.fillStyle = '#ffffff';
  g.font = 'bold 88px "Hiragino Sans","Noto Sans JP",sans-serif';
  g.fillText(name, W / 2, 116);
  g.fillStyle = '#7fe9dc';
  g.font = '500 46px "Hiragino Sans","Noto Sans JP",sans-serif';
  g.fillText(title, W / 2, 184);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;

  return new THREE.Mesh(
    new THREE.PlaneGeometry(0.72, 0.18),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
  );
}
</script>
</body>
</html>
